<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Public Administration</title>

<style>

/* ===== Body Background ===== */
body{
    font-family: 'Segoe UI', Arial, sans-serif;
    margin:0;
    padding:20px;
    background: linear-gradient(135deg, #e3f2fd, #f5f7fa);
    color:#333;
}

/* ===== Main Heading ===== */
h1{
    background: linear-gradient(135deg, #003366, #0055aa);
    color:white;
    padding:20px;
    border-radius:12px;
    box-shadow:0 6px 20px rgba(0,0,0,0.2);
}

/* ===== Teacher Image ===== */
img[align="right"]{
    float:right;
    width:130px;
    height:130px;
    border-radius:50%;
    border:4px solid #fff;
    box-shadow:0 4px 15px rgba(0,0,0,0.3);
    margin-left:15px;
}

/* ===== Outline Heading ===== */
h4{
    text-align:center;
    color:#003366;
    margin-top:30px;
}

/* ===== All Images ===== */
img{
    display:block;
    margin:20px auto;
    max-width:90%;
    border-radius:12px;
    box-shadow:0 6px 20px rgba(0,0,0,0.2);
}

/* ===== Notes Cards ===== */
div{
    max-width:850px;
    margin:30px auto;
    padding:25px;
    background:white;
    border-radius:15px;
    box-shadow:0 8px 25px rgba(0,0,0,0.1);
    transition:0.3s;
    text-align:center;
}

div:hover{
    transform: translateY(-5px);
}

/* ===== Section Titles ===== */
h2{
    color:#003366;
    margin-bottom:15px;
}

/* ===== PDF Viewer ===== */
embed{
    width:100%;
    height:380px;
    border-radius:10px;
    margin-bottom:15px;
}

/* ===== Download Button (Professional) ===== */
a{
    display:inline-block;
    padding:12px 25px;
    background: linear-gradient(135deg, #0055aa, #003366);
    color:white;
    text-decoration:none;
    border-radius:8px;
    font-size:15px;
    transition:0.3s;
    box-shadow:0 4px 10px rgba(0,0,0,0.2);
}

a:hover{
    background: linear-gradient(135deg, #003366, #001f4d);
    transform: scale(1.05);
}

/* ===== Mobile Responsive ===== */
@media (max-width:768px){

    h1{
        font-size:22px;
        text-align:center;
    }

    img[align="right"]{
        float:none;
        display:block;
        margin:10px auto;
    }

    embed{
        height:220px;
    }

    div{
        padding:15px;
        margin:20px auto;
    }

    a{
        width:90%;
        text-align:center;
    }
}
.one{
    border: 2px solid rgb(234, 20, 20);
            text-align: center;
            background-color: aquamarine;
}
.two{
    border: 2px solid rgb(20, 234, 20);
            text-align: center;
            background-color: aquamarine;
}

</style>
</head>

<body>
    <h1>Public administration By Prof. Shafi Ullah</h1>
    <img src="shafi.jpg" width="150" height="150" align="right">
    <h4>Outline of Public Administration</h4>
    <img src="Pub Adm Outline Mid Term.jpeg" height="350">
    <a href="Pub Adm Outline Mid Term.jpeg" download="Public Administration Outline Mid Term.jpeg">Download Image</a>
    <br><br>
<div class="one">
    <h2>Public Administration Notes By M.Suleman</h2>
    <embed src="Public Administration By Suleman Safi .pdf" type="application/pdf" width="50%" height="300px">
    <a href="Public Administration By Suleman Safi .pdf" download>Download</a>
    </embed>
</div>
<div class="two">
    <h2>Public Administration Notes By Mudassir Baloch</h2>
    <embed src="Public Adm By Mudassir.pdf" type="application/pdf" width="50%" height="300px">
    <a href="Public Adm By Mudassir.pdf" download>Download</a>
    </embed>
    </div>
</body>

</html>
