<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Public Administration</title>

    <style>

/* ===== Page Background ===== */
body{
    font-family: Arial, Helvetica, sans-serif;
    margin:0;
    padding:20px;
    background: linear-gradient(to right, #eef2f3, #dfe9f3);
    color:#333;
}

/* ===== Main Title ===== */
h1{
    background: linear-gradient(135deg, #003366, #0055aa);
    color:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 5px 15px rgba(0,0,0,0.2);
}

/* ===== Teacher Image ===== */
img[align="right"]{
    float:right;
    border-radius:50%;
    border:3px solid #003366;
    box-shadow:0 4px 10px rgba(0,0,0,0.3);
    margin-left:15px;
}

/* ===== Outline Heading ===== */
h4{
    text-align:center;
    margin-top:30px;
    color:#003366;
}

/* ===== Outline Image ===== */
img{
    display:block;
    margin:20px auto;
    max-width:80%;
    border-radius:10px;
    box-shadow:0 5px 15px rgba(0,0,0,0.2);
}

/* ===== Download Button ===== */
a{
    display:block;
    width:200px;
    margin:10px auto 30px;
    text-align:center;
    background:#003366;
    color:white;
    padding:10px;
    border-radius:6px;
    text-decoration:none;
    transition:0.3s;
}

a:hover{
    background:#0055aa;
    transform:scale(1.05);
}

/* ===== Notes Boxes ===== */
div{
    max-width:800px;
    margin:25px auto;
    padding:20px;
    background:white;
    border-radius:10px;
    box-shadow:0 5px 15px rgba(0,0,0,0.1);
    text-align:center;
}

/* ===== Section Titles ===== */
h2{
    color:#003366;
    margin-bottom:15px;
}

/* ===== PDF Viewer ===== */
embed{
    width:100%;
    height:350px;
    border-radius:8px;
    margin-bottom:10px;
}

/* ===== Mobile Responsive ===== */
@media(max-width:768px){

    img[align="right"]{
        float:none;
        display:block;
        margin:10px auto;
    }

    embed{
        height:250px;
    }

}

</style>
</head>

<body>
    <h1>Public administration By Prof. Shafi Ullah</h1>
    <img src="shafi.jpg" width="150" height="150" align="right">
    <h4>Outline of Public Administration</h4>
    <img src="Pub Adm Outline Mid Term.jpeg" height="350">
    <a href="Pub Adm Outline Mid Term.jpeg" download="Public Administration Outline Mid Term.jpeg">Download Image</a>
    <br><br>
<div>
    <h2>Public Administration Notes By M.Suleman</h2>
    <embed src="Public Administration By Suleman Safi .pdf" type="application/pdf" width="50%" height="300px">
    <a href="Public Administration By Suleman Safi .pdf" download>Download</a>
    </embed>
</div>
<div>
    <h2>Public Administration Notes By Mudassir Baloch</h2>
    <embed src="Public Adm By Mudassir.pdf" type="application/pdf" width="50%" height="300px">
    <a href="Public Adm By Mudassir.pdf" download>Download</a>
    </embed>
    </div>
</body>

</html>
